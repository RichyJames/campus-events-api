
name: Build and deploy ASP.Net Core app to Azure Web App - RichySoaCa2

on:
  push:
    branches: [ client ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PUBLISH_DIR: ${{ github.workspace }}/publish

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: List repo files (debug)
        shell: pwsh
        run: |
          Get-Location
          Get-ChildItem -Force
          Get-ChildItem -Recurse -Filter *.csproj | Select-Object FullName

      - name: Find csproj
        id: find
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter *.csproj |
                  Where-Object { $_.FullName -notmatch '\\bin\\|\\obj\\' } |
                  Select-Object -First 1

          if (-not $proj) { throw "No .csproj found in repo!" }

          "PROJECT_PATH=$($proj.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using PROJECT_PATH=$($proj.FullName)"

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" -c Release --no-restore

      - name: Publish
        run: dotnet publish "${{ env.PROJECT_PATH }}" -c Release -o "${{ env.PUBLISH_DIR }}" --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ${{ github.workspace }}/site

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6ED70B8302954DFAB56F09A2AB3D70AE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F1EED22A60194EC2AFE538C43EA3E0BA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BB8A924DA2F1489A9B351CD33E9374C9 }}
          auth-type: IDENTITY

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: RichySoaCa2
          slot-name: Production
          package: ${{ github.workspace }}/site




